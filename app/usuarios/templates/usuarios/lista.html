{% extends "base.html" %}
{% block title %}Usuarios{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Usuarios</h2>
    <a href="{{ url_for('usuarios.nuevo') }}" class="btn btn-success">Nuevo usuario</a>
</div>

<table class="table table-striped table-hover align-middle">
    <thead class="table-dark">
        <tr><th>ID</th><th>Nombre</th><th>Usuario</th><th>Email</th><th>Acciones</th></tr>
    </thead>
    <tbody>
        {% for u in usuarios %}
        <tr>
            <td>{{ u.id }}</td>
            <td>{{ u.nombre }}</td>
            <td>{{ u.username }}</td>
            <td>{{ u.email }}</td>
            <td>
                <a href="{{ url_for('usuarios.editar', id=u.id) }}" class="btn btn-warning btn-sm">Editar</a>
                <form action="{{ url_for('usuarios.eliminar', id=u.id) }}" method="POST" class="d-inline"
                      onsubmit="return confirm('Esta seguro de eliminar?');">
                    <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
